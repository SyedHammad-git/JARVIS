<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pair J.A.R.V.I.S device</title>
  <link rel="stylesheet" href="app.css">
  <script src="pairing.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">DEVICE SETUP</p>
    <h1>Pair this PC</h1>
    <p class="intro">Install JARVIS on your PC, then enter the one-time code from your phone.</p>
    <form id="pairing-form">
      <label for="url">Backend URL</label>
      <input id="url" name="url" type="url" required autocomplete="url" placeholder="https://backend.example">
      <label for="code">8-character pairing code</label>
      <input id="code" name="code" type="text" required minlength="8" maxlength="8" autocomplete="one-time-code" spellcheck="false" autocapitalize="characters">
      <button type="submit">Pair &amp; Connect</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
