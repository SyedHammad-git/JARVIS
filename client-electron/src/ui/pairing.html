<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pair J.A.R.V.I.S device</title>
  <link rel="stylesheet" href="app.css">
  <script src="pairing.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">DEVICE SETUP</p>
    <h1>Pair this PC</h1>
    <p class="intro">Enter the backend URL and the one-time device credentials.</p>
    <form id="pairing-form">
      <label for="url">Backend URL</label>
      <input id="url" name="url" type="url" required autocomplete="url" placeholder="https://jarvis.example.com">
      <label for="device-id">Device ID</label>
      <input id="device-id" name="deviceId" type="text" required autocomplete="off" spellcheck="false">
      <label for="token">Pairing token</label>
      <input id="token" name="token" type="password" autocomplete="new-password" spellcheck="false">
      <button type="submit">Save &amp; Connect</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
